{% extends "base.html" %}
{% block title %}Reset password — Hearthlist{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block content %}
<main class="auth-card auth-card--solo">
  <a class="brand" href="{{ url_for('landing') }}">Hearthlist</a>
  <h1>Choose a new password</h1>
  <p class="auth-sub">Account: {{ email }}</p>
  <form method="post" class="auth-form">
    <label>New password
      <input type="password" name="password" required minlength="6" autocomplete="new-password" />
    </label>
    <label>Confirm password
      <input type="password" name="confirm" required minlength="6" autocomplete="new-password" />
    </label>
    <button class="btn btn-primary btn-block" type="submit">Save new password</button>
  </form>
</main>
{% endblock %}
