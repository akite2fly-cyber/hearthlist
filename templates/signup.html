{% extends "base.html" %}
{% block title %}Sign up — Hearthlist{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block content %}
<div class="auth-layout auth-layout--compact">
  <aside class="auth-photo" aria-hidden="true">
    <img src="https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=1200&q=80" alt="" />
  </aside>
  <main class="auth-card">
    <a class="brand" href="{{ url_for('landing') }}">Hearthlist</a>
    <h1>Create your household</h1>
    <p class="auth-sub">7-day free trial. No card required.</p>
    <form method="post" class="auth-form">
      <label>Your name
        <input type="text" name="name" required autocomplete="name" />
      </label>
      <label>Email
        <input type="email" name="email" required autocomplete="email" inputmode="email" autocapitalize="none" />
      </label>
      <label>Password (at least 6 characters)
        <input type="password" name="password" required minlength="6" autocomplete="new-password" />
      </label>
      <label>Household name
        <input type="text" name="household_name" placeholder="Our home" autocomplete="organization" />
      </label>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Start free trial</button>
    </form>
    <p class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </main>
</div>
{% endblock %}
